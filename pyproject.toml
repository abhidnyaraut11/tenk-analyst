[project]
name = "tenk-analyst"
version = "0.1.0"
description = "Ask questions about the 10-K filings of ten US auto companies (BUAN 6343 class project)"
requires-python = ">=3.12,<3.13"
# Versions were tested together on November 8, 2026. Change them only if you have a reason.
dependencies = [
    "langchain==1.4.9",
    "langchain-core==1.7.6",
    "langchain-openai==1.7.4",
    "langchain-qdrant==1.1.0",
    "langchain-text-splitters==1.1.3",
    "langgraph==1.2.20",
    "langgraph-checkpoint-postgres==3.2.0",
    "qdrant-client==1.20.0",
    "flashrank==0.2.10",
    "psycopg[binary]==3.3.8",
    "psycopg-pool==3.3.3",
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "streamlit==1.67.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]  # lets tests import the backend package

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
package = false
# Intel Macs: onnxruntime (used by FlashRank) has no Intel-Mac build after 1.23.
constraint-dependencies = ["onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'"]
